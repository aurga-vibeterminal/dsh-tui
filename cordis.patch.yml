# dsh-tui — terminal UI bundle for DeepSeek Harness.
# Two-plugin app pattern (as dsh-headless / dsh-web-app): a startup provider
# parses the app's flags from the launcher's argument snapshot and provides the
# tuiStartup service; the runner injects it and owns the terminal.
#
# The workspace registry carries archive membership (the same state the web
# UI's archive writes); the session picker hides archived sessions through it.
- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: tui-startup
      name: '@vterminal/dsh-tui/startup'
    - id: tui-runner
      name: '@vterminal/dsh-tui'
      inject: [tuiStartup]
      config:
        resume: !!js ctx.tuiStartup.resume
        resumePicker: !!js ctx.tuiStartup.resumePicker
        preset: !!js ctx.tuiStartup.preset ?? 'standard'
        model: !!js "ctx.tuiStartup.model === undefined ? undefined : ctx.tuiStartup.model.provider + '/' + ctx.tuiStartup.model.model"
        theme: !!js ctx.tuiStartup.theme ?? 'dark'
        prompt: !!js ctx.tuiStartup.prompt
        record: !!js ctx.tuiStartup.record
        interruptAfterMs: !!js ctx.tuiStartup.interruptAfterMs
# HMR stays enabled with the base default `root: []` — configuration watches
# only, no module watching: profile patch changes (e.g. MCP rows added through
# the conversation) apply live, while the dev-linked bundle's rebuilt code is
# never hot-swapped under the fullscreen app. /reload forces a reconcile.
- id: hmr
  disabled: false
